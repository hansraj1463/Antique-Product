<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>First-project</title>
</head>

<body>
    <header class="w-full mx-auto bg-[#1C3553] p-4 flex justify-between  ">
        <div class="font-bold text-4xl">Purani <span class="text-[#C69A3F]">Nishaniyan</span>
        </div>

        <nav class="hidden md:block">
            <ul class="flex gap-5 font-bold text-white text-xl my-2">
                <li><a href="#">Collection</a></li>
                <li><a href="#">How to buy</a></li>
                <li><a href="#">About us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="w-full  mx-auto p-8 bg-[#2F5D8C] grid grid-cols-1 md:grid-cols-2">
        <div class="w-full max-w-[700px]">
            <h1 class="text-white text-7xl font-bold p-10 mx-auto">Old things, new stories.</h1>
            <p class="text-black text-xl mx-auto pl-10">Handpicked vintage pieces in brass, wood, glass and clay. <br>
                Order online, or visit our shop in Jaipur and see them <br> in person.</p>
            <div class="w-full p-8 mx-auto ">
                <button
                    class=" border border-[#C69A3F]  bg-[#C69A3F] rounded-lg p-3 text-center border-3 mx-auto hover:bg-white cursor-pointer">Browse
                    the collection</button>
                <button
                    class=" border border-[#C69A3F] text-white rounded-lg p-3 border-3 mx-auto hover:bg-[#C69A3F] cursor-pointer">Visit
                    the shop</button>
            </div>
        </div>
        <div class="w-full mx-auto max-w-[300px] ">
            <img src="./images/pic-1.png" alt="">
        </div>
    </section>

    
</body>

</html>
